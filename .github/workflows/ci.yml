---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q amazon_tracker tracker.py

      - name: Lint (import + ast parse each module)
        run: |
          python -c "import amazon_tracker.cli, amazon_tracker.config, amazon_tracker.utils, amazon_tracker.parser, amazon_tracker.storage, amazon_tracker.diff, amazon_tracker.fetch, amazon_tracker.detail, amazon_tracker.material"

      - name: Unit tests (offline — no network)
        run: python -m unittest discover -s tests -v

      - name: CLI help smoke test
        run: |
          python tracker.py --help
          python tracker.py material --help
